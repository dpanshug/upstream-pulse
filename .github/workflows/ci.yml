name: CI

on:
  pull_request:
    branches: [main, preprod, rhai-org-pulse]
  push:
    branches: [main, preprod, rhai-org-pulse]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Backend: type-check, lint, integration tests ──
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: upstream_pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/\
        upstream_pulse_test"
      TEST_DATABASE_URL: "postgresql://postgres:password@localhost:5432/\
        upstream_pulse_test"
      TEST_ADMIN_DATABASE_URL: "postgresql://postgres:password@localhost:5432/\
        postgres"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: backend

      - name: Audit for critical vulnerabilities
        run: npm audit --audit-level=critical
        working-directory: backend

      - name: Type check
        run: npm run type-check
        working-directory: backend

      - name: Run tests
        run: npm test
        working-directory: backend

  # ── Frontend: type-check, build ──
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Audit for critical vulnerabilities
        run: npm audit --audit-level=critical
        working-directory: frontend

      - name: Type check & build
        run: npm run build
        working-directory: frontend

  manifests:
    name: OpenShift Manifest Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install kustomize
        uses: "imranismail/setup-kustomize@53f941b41dca13ed\
          61874bbc6b4b6e1562877530"
        with:
          kustomize-version: '5.8.1'

      - name: Build deployment overlays
        run: |
          kustomize build deploy/openshift/overlays/dev >/dev/null
          kustomize build deploy/openshift/overlays/preprod >/dev/null
          kustomize build deploy/openshift/overlays/prod >/dev/null
