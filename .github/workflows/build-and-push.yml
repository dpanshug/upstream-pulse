name: Build and Push Images

on:
  push:
    branches: [main, preprod, rhai-org-pulse]
    paths-ignore:
      - .github/workflows/**
      - deploy/openshift/overlays/*/kustomization.yaml

env:
  REGISTRY: quay.io
  REGISTRY_ORG: org-pulse

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Resolve image tags
        id: image-tags
        run: |
          image_tag=$(git rev-parse --short HEAD)
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF_NAME" in
            main) channel_tag=latest ;;
            preprod) channel_tag=preprod-latest ;;
            rhai-org-pulse) channel_tag=rhai-org-pulse-latest ;;
            *)
              echo "Unsupported release branch: $GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac
          {
            echo "backend_tags<<EOF"
            echo "$REGISTRY/$REGISTRY_ORG/upstream-pulse-backend:$image_tag"
            echo "$REGISTRY/$REGISTRY_ORG/upstream-pulse-backend:$channel_tag"
            echo EOF
            echo "frontend_tags<<EOF"
            echo "$REGISTRY/$REGISTRY_ORG/upstream-pulse-frontend:$image_tag"
            echo "$REGISTRY/$REGISTRY_ORG/upstream-pulse-frontend:$channel_tag"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./backend
          push: true
          tags: ${{ steps.image-tags.outputs.backend_tags }}

      - name: Build and push frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.image-tags.outputs.frontend_tags }}

  promote-image-tags:
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install kustomize
        uses: "imranismail/setup-kustomize@53f941b41dca13ed\
          61874bbc6b4b6e1562877530"
        with:
          kustomize-version: '5.8.1'

      - name: Determine target overlay
        run: |
          case "$GITHUB_REF_NAME" in
            main|rhai-org-pulse)
              echo "OVERLAY=prod" >> "$GITHUB_ENV"
              ;;
            preprod)
              echo "OVERLAY=preprod" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported release branch: $GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac

      - name: Update image tags in overlay
        run: |
          cd "deploy/openshift/overlays/${OVERLAY}"
          image_tag=$(git rev-parse --short HEAD)
          backend_image="$REGISTRY/$REGISTRY_ORG/upstream-pulse-backend:$image_tag"
          frontend_image="$REGISTRY/$REGISTRY_ORG/upstream-pulse-frontend:$image_tag"
          kustomize edit set image "$backend_image"
          kustomize edit set image "$frontend_image"

      - name: Commit image tags on main and preprod
        if: github.ref_name != 'rhai-org-pulse'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          overlay_file="deploy/openshift/overlays/${OVERLAY}/kustomization.yaml"
          git add "$overlay_file"
          if ! git diff --cached --quiet; then
            image_tag=$(git rev-parse --short HEAD)
            git commit -m "chore: update image tags to $image_tag [skip ci]"
            auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c http.extraheader="AUTHORIZATION: basic $auth_header" \
              push "https://github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Open RHAI image promotion PR
        if: github.ref_name == 'rhai-org-pulse'
        uses: "peter-evans/create-pull-request@22a9089034f40e5a961c8808d\
          113e2c98fb63676"
        with:
          token: ${{ secrets.PAT_TOKEN }}
          branch: automation/rhai-org-pulse-image-tags
          base: rhai-org-pulse
          commit-message: "chore: update RHAI image tags"
          title: "chore: promote RHAI image tags"
          body: >-
            Automated image-tag update for the RHAI release branch from
            `${{ github.sha }}`. Review build and CI results before merging;
            GitOps promotion remains a separate manual sync.
          add-paths: deploy/openshift/overlays/prod/kustomization.yaml
