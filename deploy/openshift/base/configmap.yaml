apiVersion: v1
kind: ConfigMap
metadata:
  name: upstream-pulse-config
  namespace: upstream-pulse
  labels:
    app.kubernetes.io/part-of: upstream-pulse
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"
  PROMETHEUS_ENABLED: "true"
  GITHUB_TEAM_ORG: "opendatahub-io"
  # Opt-in: insert ORG_REGISTRY collection defaults into the DB at
  # startup. Off by default — the org list is managed via the UI/API.
  ORG_REGISTRY_AUTOSEED: "false"
  ADMIN_USERS: "admin"
  ADMIN_GROUPS: ""
  # Contribution data source for new projects: github | collectoss
  DEFAULT_DATA_SOURCE: "github"
  # CollectOSS schema ('data' for CollectOSS >= 1.0, 'augur_data' for legacy Augur DBs)
  COLLECTOSS_SCHEMA: "data"
  # Collect from GitHub when a CollectOSS project's repo is missing/unreachable in CollectOSS
  COLLECTOSS_FALLBACK_TO_GITHUB: "true"
